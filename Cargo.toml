[package]
name = "investo-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.2"
sqlx = { version = "0.9.0", features = ["sqlite"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
[dev-dependencies]
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
